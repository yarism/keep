<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Titlebar row: traffic lights + centered title -->
  <div id="titlebar">
    <div id="titlebar-title" class="titlebar-title" hidden>
      <span class="icon titlebar-title-icon" data-icon="folder" data-size="14"></span>
      <span id="titlebar-title-text"></span>
    </div>
  </div>

  <!-- Toolbar row: buttons -->
  <div id="toolbar-row">
    <div id="toolbar">
      <div class="toolbar-group">
        <button id="btn-open" title="Open Repository">
          <span class="icon" data-icon="folder" data-size="17"></span>
          <span>Open</span>
        </button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <button id="btn-fetch" title="Fetch" disabled>
          <span class="icon" data-icon="fetch" data-size="17"></span>
          <span>Fetch</span>
        </button>
        <button id="btn-pull" title="Pull" disabled>
          <span class="icon" data-icon="pull" data-size="17"></span>
          <span>Pull</span>
          <span id="badge-pull" class="btn-badge behind" hidden></span>
        </button>
        <button id="btn-push" title="Push" disabled>
          <span class="icon" data-icon="push" data-size="17"></span>
          <span>Push</span>
          <span id="badge-push" class="btn-badge ahead" hidden></span>
        </button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <button id="btn-stash-apply" title="Apply Stash" disabled>
          <span class="icon" data-icon="stash-apply" data-size="17"></span>
          <span>Apply Stash</span>
        </button>
        <button id="btn-stash" title="Save Stash" disabled>
          <span class="icon" data-icon="stash-save" data-size="17"></span>
          <span>Save Stash</span>
        </button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <button id="btn-merge" title="Merge" disabled>
          <span class="icon" data-icon="merge" data-size="17"></span>
          <span>Merge</span>
        </button>
        <button id="btn-rebase" title="Rebase" disabled>
          <span class="icon" data-icon="rebase" data-size="17"></span>
          <span>Rebase</span>
        </button>
      </div>

      <div class="toolbar-right">
        <div id="history-search-bar" hidden>
          <select id="search-field">
            <option value="message">Message</option>
            <option value="author">Author</option>
            <option value="hash">Commit Hash</option>
            <option value="file">File</option>
          </select>
          <div id="search-input-wrap">
            <span class="icon" data-icon="search" data-size="13"></span>
            <input type="text" id="search-input" placeholder="Search...">
            <button id="search-clear" style="display:none" title="Clear"><span class="icon" data-icon="close" data-size="12"></span></button>
          </div>
        </div>
        <button id="btn-theme" class="icon-button" title="Theme" aria-haspopup="true">
          <span class="icon" data-icon="palette" data-size="17"></span>
        </button>
      </div>
    </div>

    <!-- Theme picker -->
    <div id="theme-menu" class="popover" role="menu" hidden>
      <div class="popover-header">Theme</div>
      <div id="theme-menu-items"></div>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div id="breadcrumb">
    <span id="breadcrumb-repos" class="breadcrumb-link">
      <span class="icon" data-icon="drive" data-size="14"></span>
      Repositories
    </span>
    <span id="breadcrumb-sep" class="breadcrumb-sep icon" data-icon="chevron" data-size="12" hidden></span>
    <span id="breadcrumb-repo" class="breadcrumb-current" hidden>
      <span class="icon" data-icon="folder" data-size="14"></span>
      <span id="breadcrumb-repo-name"></span>
    </span>
  </div>

  <div id="app">
    <!-- Left sidebar -->
    <aside id="sidebar">
      <!-- Repo list mode -->
      <div id="repo-list-section">
        <div class="sidebar-section" data-section="repositories">
          <div class="section-header sidebar-header-row">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="repo-list">
              <span class="icon expand-arrow open" data-icon="chevron" data-size="11"></span>
              <span>Repositories</span>
            </button>
            <button id="btn-add-repo" class="sidebar-add-btn" title="Add Repository"><span class="icon" data-icon="plus" data-size="14"></span></button>
          </div>
          <div id="repo-list" class="section-list"></div>
        </div>
      </div>

      <!-- Workspace mode -->
      <div id="workspace-nav" hidden>
        <div class="sidebar-section" data-section="workspace">
          <div class="section-header">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="sidebar-nav">
              <span class="icon expand-arrow open" data-icon="chevron" data-size="11"></span>
              <span>Workspace</span>
            </button>
          </div>
          <nav id="sidebar-nav" class="section-list">
            <div class="nav-item active" data-view="working-copy">
              <span class="icon" data-icon="folder" data-size="16"></span>
              Working Copy
              <span id="wc-badge" class="badge" hidden>0</span>
            </div>
            <div class="nav-item" data-view="history">
              <span class="icon" data-icon="clock" data-size="16"></span>
              History
            </div>
            <div class="nav-item" data-view="stashes">
              <span class="icon" data-icon="stash" data-size="16"></span>
              Stashes
            </div>
          </nav>
        </div>

        <div class="sidebar-section" data-section="branches">
          <div class="section-header">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="branches-list">
              <span class="icon expand-arrow open" data-icon="chevron" data-size="11"></span>
              <span>Branches</span>
            </button>
          </div>
          <div id="branches-list" class="section-list"></div>
        </div>
        <div class="sidebar-section" data-section="tags">
          <div class="section-header">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="tags-list">
              <span class="icon expand-arrow open" data-icon="chevron" data-size="11"></span>
              <span>Tags</span>
            </button>
          </div>
          <div id="tags-list" class="section-list"></div>
        </div>
        <div class="sidebar-section" data-section="remotes">
          <div class="section-header">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="remotes-list">
              <span class="icon expand-arrow open" data-icon="chevron" data-size="11"></span>
              <span>Remotes</span>
            </button>
          </div>
          <div id="remotes-list" class="section-list"></div>
        </div>
      </div>
    </aside>

    <!-- Sidebar resize handle -->
    <div id="sidebar-resize"></div>

    <!-- Main content -->
    <main id="content">
      <!-- Welcome / repo detail -->
      <div id="welcome-view" class="view active">
        <div class="welcome">
          <h1>Keep</h1>
          <p>Select a repository or click Open to add one</p>
          <button id="btn-open-welcome">Open Repository</button>
        </div>
      </div>

      <!-- Working Copy -->
      <div id="working-copy-view" class="view">
        <div id="wc-container">
          <div id="wc-files-panel">
            <div id="commit-box">
              <input type="text" id="commit-subject" placeholder="Commit Subject">
              <div id="commit-actions">
                <button id="btn-stage-all">Stage All</button>
                <button id="btn-commit" disabled>Commit</button>
              </div>
            </div>
            <div class="panel-header"><span>Changed Files</span></div>
            <div id="wc-file-list" class="file-list"></div>
          </div>
          <div id="wc-diff-panel">
            <div class="panel-header"><span id="diff-filename">No file selected</span></div>
            <div id="diff-content" class="diff-view"></div>
          </div>
        </div>
      </div>

      <!-- History -->
      <div id="history-view" class="view">
        <div id="history-container">
          <div id="history-list-panel">
            <div class="panel-header">
              <span id="history-branch-label">master</span>
              <div class="panel-header-right">
                <span id="history-tracking" class="tracking" hidden></span>
                <div id="history-scope" class="segmented" role="group" aria-label="History scope">
                  <button type="button" data-scope="branch" class="active">This branch</button>
                  <button type="button" data-scope="all">All branches</button>
                </div>
              </div>
            </div>
            <div id="history-list" class="commit-list"></div>
          </div>
          <div id="history-detail-panel">
            <div id="commit-info"></div>
            <div id="commit-changeset"></div>
          </div>
        </div>
      </div>

      <!-- Stashes -->
      <div id="stashes-view" class="view">
        <div id="stash-list" class="commit-list"></div>
      </div>
    </main>
  </div>

  <!-- Transient status for long-running git commands -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Context menu -->
  <div id="context-menu" class="context-menu" hidden>
    <div id="context-menu-items"></div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <input type="text" id="modal-input" class="modal-input">
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
