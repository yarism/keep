name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Prose changes nothing that ships. Releases are safe from this filter either
    # way: npm version always rewrites package.json, so a tag can never sit on a
    # commit that only touched markdown.
    paths-ignore: ['**.md', 'screenshots/**']
  pull_request:
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            args: --mac --arm64 --x64
          - os: windows-latest
            label: windows
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A release that scares Gatekeeper is worse than no release, so a missing
      # certificate stops the tag here rather than surfacing on someone's Mac.
      - name: Refuse to release an unsigned macOS build
        if: matrix.label == 'macos' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::MAC_CERT_P12 is unset, so this build cannot be signed or notarized. See README > Releasing > Signing for the five secrets it needs."
            exit 1
          fi

      # electron-builder reads CSC_LINK as a path, so an empty one resolves to the
      # checkout directory and fails. The signing variables have to be absent
      # rather than blank, which only a shell can express.
      - name: Build installers
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.args }} --publish never

      # The .yml is the update feed and the .blockmap is what turns a patch
      # release into a partial download, so both travel with the installers.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: keep-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    # Only tags become releases. Both platforms must be built before it is cut,
    # so the download links are never live against a half-populated release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --latest
          installers/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
