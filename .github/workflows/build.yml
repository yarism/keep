name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Prose changes nothing that ships. Releases are safe from this filter either
    # way: npm version always rewrites package.json, so a tag can never sit on a
    # commit that only touched markdown.
    paths-ignore: ['**.md', 'screenshots/**']
  pull_request:
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

# A release pushes the commit and its tag together — `npm version` makes both and
# `git push --follow-tags` sends them at once — and this workflow answers both
# events, so a release used to build macOS and Windows twice over. Only the tag
# run cuts a release; the branch run's installers are the same bytes, uploaded to
# itself as artifacts nobody goes looking for.
#
# The tag run cancels the branch run, and never the other way round: a run that
# publishes must not be killable by the push that carried it. That asymmetry is
# the whole point of the expression, and it is best-effort — if the branch run is
# filed second there is nothing in progress for it to replace, and both build, as
# they always did.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # No --arm64 --x64 here: the arches are declared per target in
          # package.json instead. Passing them as flags splits the build into one
          # electron-builder run per arch, and each run overwrites the previous
          # one's latest-mac.yml — leaving a feed that names a single arch and an
          # updater that finds nothing on the other.
          - os: macos-latest
            label: macos
            args: --mac
          - os: windows-latest
            label: windows
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A release that scares Gatekeeper is worse than no release, so a missing
      # certificate stops the tag here rather than surfacing on someone's Mac.
      - name: Refuse to release an unsigned macOS build
        if: matrix.label == 'macos' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::MAC_CERT_P12 is unset, so this build cannot be signed or notarized. See README > Releasing > Signing for the five secrets it needs."
            exit 1
          fi

      # Handing electron-builder a CSC_LINK is what makes it build its own
      # keychain, and that is the code path that broke: it creates the keychain
      # with a random password and then calls `security set-key-partition-list`
      # with the certificate's password instead, which stopped being harmless on
      # the macos-26 image of 20260831. The certificate is imported here instead,
      # into a keychain whose password this step knows, and electron-builder is
      # left to discover the identity in it. Still true in the newest release
      # (26.15.3), so upgrading is not the way out.
      - name: Import the signing certificate into a keychain
        if: matrix.label == 'macos'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CERT_P12" ]; then
            echo "No certificate configured, so this build will be unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No timeout and no lock on sleep: a keychain that relocks halfway
          # through a fifteen-minute build is the failure this step exists to
          # avoid.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/cert.p12"

          # The keychain's own password, which is the one thing electron-builder
          # gets wrong. Without this codesign cannot reach the key, and on a
          # runner there is nobody to answer the prompt that follows.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # `security find-identity` only looks at the search list, so the new
          # keychain joins it rather than replacing what is already there.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::the certificate imported but carries no Developer ID Application identity"
            exit 1
          fi

      # The notarization variables have to be absent rather than blank when
      # there is nothing to sign with, which only a shell can express.
      #
      # Windows builds unsigned, on purpose. The only certificate in this repo
      # is an Apple one; signtool accepts it and Windows does not trust it, so
      # signing with it bought the same SmartScreen prompt as no signature plus
      # a minute of build time. The updater does not look at Windows signatures
      # either: build.win sets no publisherName, and electron-updater only
      # verifies when one is set. The README already says the installer is
      # unsigned, so this is the workflow catching up with the documentation.
      - name: Build installers
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ "${{ matrix.label }}" != "macos" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.args }} --publish never

      # Auto-discovery fails softly: no identity in the keychain means a warning
      # and an unsigned app, not an error. The tag guard above promises that
      # cannot reach a release, so the promise is checked rather than assumed.
      - name: Refuse to ship a macOS build that did not get signed
        if: matrix.label == 'macos'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
        run: |
          set -euo pipefail
          [ -n "$MAC_CERT_P12" ] || exit 0
          for app in dist/mac*/Keep.app; do
            [ -d "$app" ] || { echo "::error::no built app at $app"; exit 1; }
            # Passing the seal is not the question here: an ad-hoc signature
            # verifies and satisfies its own designated requirement just as
            # happily as a real one. Who signed it is the question.
            codesign --verify --strict --verbose=1 "$app"
            # `-d --verbose=2`, not `-dv`. The authority chain is not printed at
            # verbosity 1, so the shorter spelling reports nothing at all and
            # fails a perfectly good build.
            codesign -d --verbose=2 "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::$app is not signed with the Developer ID certificate"; exit 1; }
          done

      # The .yml is the update feed and the .blockmap is what turns a patch
      # release into a partial download, so both travel with the installers.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: keep-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    # Only tags become releases. Both platforms must be built before it is cut,
    # so the download links are never live against a half-populated release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --latest
          installers/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
